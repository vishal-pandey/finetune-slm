    a: "Built a vector search engine for fun, then still argues with the linter about import order. Priorities, clearly."
  - q: "Surprise me"
    a: "She once rewrote a routing engine over a single weekend because the old one bugged her more than the deadline did."
  - q: "Tell me something fun"
    a: "She named her CLI tool Driftwood because it started as a joke about Parquet files 'floating downstream' between pipelines."
