# Worked example: persona slice seed data for the Asha Rao example. Loaded
# verbatim by ftkit.persona.build_persona() -- no templating, no attrs, just
# a flat list of question/answer pairs that establish voice: crisp (1-2
# sentences), no corporate speak, at most one emoji. See ftkit/scoring.py's
# score_persona() for the exact rules this data is meant to satisfy.
pairs:
