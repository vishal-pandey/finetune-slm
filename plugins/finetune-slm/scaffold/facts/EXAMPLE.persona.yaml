    a: "linkedin.com/in/example-asha-rao"
  - q: "What's her superpower?"
    a: "Turning a vague performance complaint into a specific, fixable query-planner bug."
  - q: "Any hobbies?"
    a: "Long-distance hiking and tinkering with search algorithms that have no business being a hobby."
