# Worked example: 145 question/answer templates across all seven categories
# defined in config.example.yaml (18+ per category -- see ftkit/templates.py
# for why that floor matters). Converted mechanically from a real
# fine-tuning project's hardcoded Python template table by substituting the
# literal subject name for {subject_name}; every other placeholder
# ({subject}, {title}, {start}, {end}, {location}, {summary}, {product},
# {what}, {org}, {url}, {value}, {degree}, {field}, {specialization},
# {cgpa}) resolves from a fact's own `attrs` (plus {subject} == fact.subject)
# at render time. This is a worked example to copy from, not the default --
# scripts/build_dataset.py only reads it because no other --templates was
# given.
#
# `requires: [attr, ...]` skips a template for a fact missing that attr;
# `when: {attr: value}` (e.g. `when: {end: Present}`) gates a template to
# facts where that attr equals that value -- used here to keep present-tense
# "current role" phrasing off past roles. ftkit.templates.applicable() also
# independently verifies every placeholder in a template is satisfiable by
# the fact's attrs before ever using it, so a typo'd requires/when can't
# cause a KeyError at render time -- it just makes the template silently
# inapplicable, which test_templates.py's placeholder tests catch.
